services:
  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:18.3-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
      # variável CUSTOMIZADA, lida pelo init-databases.sh:
      POSTGRES_EXTRA_DATABASES: user, appointment, catalog
    volumes:
      # ATENÇÃO Postgres 18+: monte em /var/lib/postgresql (SEM /data no fim).
      # Montar em /var/lib/postgresql/data quebra a imagem 18+.
      - postgres_data:/var/lib/postgresql
      # scripts em /docker-entrypoint-initdb.d/ rodam UMA vez, na criação do volume:
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      # informe -d postgres! Sem -d, o pg_isready tenta conectar num
      # database com o nome do usuário ("admin") que não existe.
      test: [ "CMD-SHELL", "pg_isready -U admin -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── RabbitMQ (com UI de administração na 15672) ────────────
  rabbitmq:
    image: rabbitmq:4.2.4-management-alpine
    ports:
      - "5672:5672" # AMQP (os serviços conectam aqui)
      - "15672:15672" # UI web: http://localhost:15672 (admin/admin)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Serviços de aplicação ──────────────────────────────────
  user:
    build:
      # context é a RAIZ do monorepo, não a pasta do serviço!
      # O Dockerfile precisa copiar package.json da raiz e packages/shared.
      context: .
      dockerfile: services/user/Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - ./services/user/.env
    # o .env aponta para localhost (dev fora do Docker); aqui os hosts são os containers
    environment:
      PORT: 8081
      DATABASE_URL: postgresql://admin:admin@postgres:5432/user
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    ports:
      - "8083:8083"
    env_file:
      - ./services/catalog/.env
    environment:
      PORT: 8083
      DATABASE_URL: postgresql://admin:admin@postgres:5432/catalog
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  appointment:
    build:
      context: .
      dockerfile: services/appointment/Dockerfile
    ports:
      - "8082:8082"
    env_file:
      - ./services/appointment/.env
    environment:
      PORT: 8082
      DATABASE_URL: postgresql://admin:admin@postgres:5432/appointment
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      USER_SERVICE_URL: http://user:8081
      CATALOG_SERVICE_URL: http://catalog:8083
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ── API Gateway (Kong DB-less) ─────────────────────────────
  # Ponto de entrada único do frontend: http://localhost:8000
  kong:
    image: kong:3.9.1
    ports:
      - "8000:8000" # proxy (o frontend chama aqui)
      - "127.0.0.1:8001:8001" # Admin API, só leitura útil em DB-less (ex: GET /routes)
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./docker/kong/kong.yml:/kong/kong.yml:ro
    healthcheck:
      test: [ "CMD", "kong", "health" ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      - user
      - catalog
      - appointment

volumes:
  postgres_data:
  rabbitmq_data: