_format_version: "3.0"

# Kong DB-less. Roteia pelo recurso, sem prefixo de serviço (strip_path: false):
# o path que chega no serviço é o mesmo que o frontend chamou.
#
# Os hosts (user/catalog/appointment/payment) são os nomes dos containers no
# docker-compose.yml. No docker-compose.dev.yml os serviços rodam na máquina
# host e o Kong resolve esses nomes via extra_hosts -> host-gateway.

services:
  - name: user-service
    url: http://user:8081
    routes:
      - name: user-routes
        paths:
          - /auth
          - /users
        strip_path: false
      - name: user-auth-credentials-routes
        paths:
          - /auth/login
          - /auth/register
          - /auth/reset-password
        methods:
          - POST
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              hour: 60
              policy: local
              limit_by: ip
              fault_tolerant: true
              error_message: Muitas tentativas em pouco tempo. Aguarde um instante e tente novamente.
      - name: user-auth-forgot-password-routes
        paths:
          - /auth/forgot-password
        methods:
          - POST
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 3
              hour: 10
              policy: local
              limit_by: ip
              fault_tolerant: true
              error_message: Muitas tentativas em pouco tempo. Aguarde um instante e tente novamente.
      - name: user-auth-session-routes
        paths:
          - /auth/refresh-token
          - /auth/oauth/upsert
        methods:
          - POST
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 1000
              policy: local
              limit_by: ip
              fault_tolerant: true
      - name: user-public-routes
        paths:
          - /public/artists
        methods:
          - GET
        strip_path: false

  - name: catalog-service
    url: http://catalog:8083
    routes:
      - name: catalog-routes
        paths:
          - /services
          - /galeries
        strip_path: false
      - name: catalog-public-routes
        paths:
          - /public/services
          - /public/galeries
        methods:
          - GET
        strip_path: false

  - name: appointment-service
    url: http://appointment:8082
    routes:
      - name: appointment-routes
        paths:
          - /appointments
          - /booking-requests
          - /reminders
        strip_path: false
      - name: appointment-public-read-routes
        paths:
          - /public/appointments
        methods:
          - GET
        strip_path: false
      - name: appointment-public-booking-routes
        paths:
          - /public/appointments
        methods:
          - POST
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 5
              hour: 20
              policy: local
              limit_by: ip
              fault_tolerant: true
              error_message: Muitas tentativas de agendamento em pouco tempo. Aguarde um instante e tente novamente.
      - name: appointment-public-booking-request-read-routes
        paths:
          - /public/booking-requests
        methods:
          - GET
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 30
              policy: local
              limit_by: ip
              fault_tolerant: true
      - name: appointment-public-booking-request-write-routes
        paths:
          - /public/booking-requests
        methods:
          - POST
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              hour: 60
              policy: local
              limit_by: ip
              fault_tolerant: true
              error_message: Muitas mensagens em pouco tempo. Aguarde um instante e tente novamente.

  - name: payment-service
    url: http://payment:8084
    routes:
      - name: payment-routes
        paths:
          - /billing
        strip_path: false
      - name: payment-webhook-routes
        paths:
          - /webhooks
        methods:
          - POST
        strip_path: false

plugins:
  # Propaga um X-Request-ID por requisição, para correlacionar logs entre serviços.
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true
  - name: rate-limiting
    config:
      minute: 300
      policy: local
      limit_by: ip
      fault_tolerant: true
      error_message: Muitas requisições em pouco tempo. Aguarde um instante e tente novamente.
